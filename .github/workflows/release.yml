name: Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  binaries:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: x86_64-linux
          - runner: macos-15
            platform: aarch64-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build stamped native binary
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          nix-build -A package -o result-package \
            --argstr releaseVersion "$RELEASE_TAG" \
            --argstr revision "$revision"
          mkdir -p dist
          cp result-package/bin/ollame "dist/ollame-$PLATFORM"
          "dist/ollame-$PLATFORM" version
          file "dist/ollame-$PLATFORM"
          if [[ "$PLATFORM" == x86_64-linux ]]; then
            file "dist/ollame-$PLATFORM" | grep -q 'statically linked'
          else
            file "dist/ollame-$PLATFORM" | grep -q 'arm64'
            if otool -L "dist/ollame-$PLATFORM" | grep -q '/nix/store/'; then
              echo 'release binary depends on the Nix store' >&2
              exit 1
            fi
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ollame-${{ matrix.platform }}
          path: dist/ollame-*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ollame-*
          path: dist
          merge-multiple: true
      - name: Include project license
        run: cp LICENSE dist/LICENSE
      - name: Checksum release binaries
        working-directory: dist
        run: sha256sum ollame-aarch64-darwin ollame-x86_64-linux > SHA256SUMS
      - name: Build and check the container
        run: |
          nix-build -A scripts.publish -o result-publish
          ./result-publish/bin/publish-ollame \
            --release-version "$RELEASE_TAG" \
            --revision "$(git rev-parse HEAD)" \
            --action build
      - name: Push to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker push "ghcr.io/jpetrucciani/ollame:$RELEASE_TAG"
      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
